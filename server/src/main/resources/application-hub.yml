# Facilitator hub: same jar, local file database, no public listener by default.
spring:
  datasource:
    url: jdbc:h2:file:./data/hub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

server:
  address: 127.0.0.1
  port: 8080

sopaan:
  profile: hub
  demo-mode: true
