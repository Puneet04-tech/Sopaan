# Render blueprint. Checked in but never deployed by this repository; deploying is the
# owner's decision. Free plan values are illustrative and may change.
services:
  - type: web
    name: sopaan-web
    env: static
    plan: free
    buildCommand: npm --prefix web ci && npm --prefix tools ci && npm --prefix tools run packs && npm --prefix web run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /packs/*
        name: Cache-Control
        value: no-cache

  - type: web
    name: sopaan-server
    env: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: sopaan-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: sopaan-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sopaan-db
          property: password
      - key: SOPAAN_JWT_SECRET
        generateValue: true
      - key: SOPAAN_DEMO_MODE
        value: "false"
      - key: SOPAAN_PACKS_DIR
        value: /app/packs
      - key: SOPAAN_KEYS_FILE
        value: /app/tools/dev-keys.json

  - type: web
    name: sopaan-ai
    env: docker
    plan: free
    dockerfilePath: ./ai/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SOPAAN_AI_PROVIDER
        value: deterministic
      - key: SOPAAN_WEB_ORIGIN
        value: "*"

databases:
  - name: sopaan-db
    plan: free
    databaseName: sopaan
    user: sopaan
