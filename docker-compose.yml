# One command brings up the PWA, the Spring Boot API and the optional AI sidecar.
# Everything is demo-configured: dev keys, simulated credits, H2 file database.
name: sopaan

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SOPAAN_DEMO_MODE: "true"
      SOPAAN_JWT_SECRET: "${SOPAAN_JWT_SECRET:-compose-demo-secret-change-me-32-chars}"
      SOPAAN_PACKS_DIR: /app/packs
      SOPAAN_KEYS_FILE: /app/tools/dev-keys.json
    volumes:
      - sopaan-data:/app/data
    restart: unless-stopped

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      - "8000:8000"
    environment:
      SOPAAN_AI_PROVIDER: "${SOPAAN_AI_PROVIDER:-deterministic}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      SOPAAN_WEB_ORIGIN: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  sopaan-data:
