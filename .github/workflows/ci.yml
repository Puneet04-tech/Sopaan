name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-and-packs:
    name: Packs, web tests, PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tools/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix tools ci
      - run: npm --prefix tools run packs
      - run: npm --prefix web run test
      - run: npm --prefix web run build
      - name: Verify a signed pack from the command line
        run: node tools/verify.mjs packs/schemes-mh/2026.10.14-1.json

  server:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test
        working-directory: server
        run: mvn -B -q test

  ai:
    name: AI sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r ai/requirements.txt
      - name: Test
        run: python -m pytest ai -q

  docker:
    name: Compose build
    runs-on: ubuntu-latest
    needs: [web-and-packs, server, ai]
    steps:
      - uses: actions/checkout@v4
      - name: Build images without starting services
        run: docker compose build
